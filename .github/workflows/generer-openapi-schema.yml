name: Generer OpenAPI-skjema

on:
  push:
    branches: [main]
    paths-ignore:
      - "*.md"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  generer-skjema:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    env:
      TZ: Europe/Oslo
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          java-version: 25
          distribution: temurin

      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
        with:
          gradle-version: wrapper

      - name: Generer openapi.json
        run: ./gradlew :app:genererOpenApiJson
        env:
          GITHUB_PASSWORD: ${{ secrets.READER_TOKEN }}

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: openapi
          path: ./openapi.json
          if-no-files-found: error
          overwrite: true

      - uses: actions/create-github-app-token@f418cff399f7aef4c2f0ad47e25ca7a6abbdd6fc # v3
        id: get-saksbehandling-token
        with:
          app-id: "${{ secrets.TEAM_AAP_GITHUB_APP_ID }}"
          private-key: "${{ secrets.TEAM_AAP_GITHUB_APP_PRIVATE_KEY }}"
          owner: navikt
          repositories: aap-saksbehandling
          permission-actions: write

      - name: Varsle aap-saksbehandling
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        with:
          github-token: ${{ steps.get-saksbehandling-token.outputs.token }}
          script: |
            await github.rest.actions.createWorkflowDispatch({
              owner: 'navikt',
              repo: 'aap-saksbehandling',
              workflow_id: 'oppdater-postmottak-openapi-typer.yml',
              ref: 'main',
              inputs: {
                'run-id': process.env.GITHUB_RUN_ID
              }
            })
